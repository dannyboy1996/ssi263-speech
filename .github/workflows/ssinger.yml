# SSInger on every desktop OS: build each plug-in format, run the offline C
# tests, validate with pluginval (VST3, and AU on macOS), auval and
# clap-validator, and keep the bundles as workflow artifacts.
# Formats: VST3 + CLAP + Standalone everywhere, AU on macOS, LV2 on Linux.
# Nothing here signs for distribution, releases or tags.
name: SSInger

on:
  push:
    branches: [ssinger-xplat]
    paths:
      - "SSInger/**"
      - "src/csrc/ssi263*"
      - ".github/workflows/ssinger.yml"
  pull_request:
    paths:
      - "SSInger/**"
      - "src/csrc/ssi263*"
      - ".github/workflows/ssinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssinger-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: "0.4.1"
  # pluginval 1..10; 5 is its recommended minimum for host compatibility.
  STRICTNESS: "10"
  ART: build/SSInger_artefacts/Release
  GH_TOKEN: ${{ github.token }} # gh release download (the validator binaries)

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE's Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            g++ ninja-build pkg-config xvfb lilv-utils \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev

      - name: Configure
        run: cmake -S SSInger -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, CLAP, LV2, Standalone and the C tests
        run: cmake --build build --parallel --target SSInger_VST3 SSInger_CLAP SSInger_LV2 SSInger_Standalone test_6850_midi

      - name: Offline C tests
        run: ctest --test-dir build --output-on-failure

      - name: Get pluginval (x86_64 release)
        if: matrix.arch == 'x86_64'
        run: |
          gh release download "$PLUGINVAL_VERSION" -R Tracktion/pluginval -p pluginval_Linux.zip -O pv.zip
          unzip -q pv.zip -d pv
          echo "PLUGINVAL=$PWD/pv/pluginval" >> "$GITHUB_ENV"

      # No arm64 Linux release of pluginval: build the same tag from source.
      - name: Cache pluginval (arm64 build)
        if: matrix.arch == 'arm64'
        id: pvcache
        uses: actions/cache@v4
        with:
          path: pv-arm64
          key: pluginval-${{ env.PLUGINVAL_VERSION }}-linux-arm64-v1

      - name: Build pluginval from source (arm64)
        if: matrix.arch == 'arm64' && steps.pvcache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "${PLUGINVAL_VERSION}" --recurse-submodules --shallow-submodules \
            https://github.com/Tracktion/pluginval.git pv-src
          cmake -S pv-src -B pv-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build pv-build --parallel --target pluginval
          mkdir -p pv-arm64
          cp "$(find pv-build -type f -name pluginval -perm -u+x | head -n 1)" pv-arm64/pluginval

      - name: Use pluginval (arm64)
        if: matrix.arch == 'arm64'
        run: echo "PLUGINVAL=$PWD/pv-arm64/pluginval" >> "$GITHUB_ENV"

      - name: pluginval on the VST3
        run: |
          xvfb-run -a "$PLUGINVAL" --strictness-level "$STRICTNESS" --timeout-ms 300000 \
            --output-dir pluginval-logs --validate "$ART/VST3/SSInger.vst3"

      - name: clap-validator on the CLAP (x86_64 release)
        if: matrix.arch == 'x86_64'
        run: |
          gh release download "$CLAP_VALIDATOR_VERSION" -R free-audio/clap-validator -p '*ubuntu-22.04.zip' -O cv.zip
          unzip -q cv.zip -d cv
          chmod +x "$(find cv -type f -name clap-validator | head -n 1)"
          "$(find cv -type f -name clap-validator | head -n 1)" validate "$ART/CLAP/SSInger.clap"

      - name: LV2 bundle is discoverable (lilv)
        run: |
          LV2_PATH="$PWD/$ART/LV2" lv2ls | tee lv2ls.txt
          grep -qx 'urn:ssi263-speech:ssinger' lv2ls.txt
          LV2_PATH="$PWD/$ART/LV2" lv2info urn:ssi263-speech:ssinger | head -n 40

      - name: Pack bundles
        if: always()
        run: |
          mkdir -p dist
          cd "$ART"
          tar czf "$GITHUB_WORKSPACE/dist/SSInger-linux-${{ matrix.arch }}.tar.gz" \
            VST3/SSInger.vst3 CLAP/SSInger.clap LV2/SSInger.lv2 Standalone/SSInger

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSInger-linux-${{ matrix.arch }}
          path: |
            dist/
            pluginval-logs/
          if-no-files-found: warn

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S SSInger -B build -A x64

      - name: Build VST3, CLAP, Standalone and the C tests
        run: cmake --build build --config Release --parallel --target SSInger_VST3 SSInger_CLAP SSInger_Standalone test_6850_midi

      - name: Offline C tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: No Visual C++ runtime DLL needed
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Recurse -Filter dumpbin.exe "$vs\VC\Tools\MSVC" | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents "$env:ART/VST3/SSInger.vst3/Contents/x86_64-win/SSInger.vst3" | Out-String
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "the VST3 links the dynamic C runtime" }

      - name: pluginval on the VST3
        shell: pwsh
        run: |
          gh release download $env:PLUGINVAL_VERSION -R Tracktion/pluginval -p pluginval_Windows.zip -O pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          .\pv\pluginval.exe --strictness-level $env:STRICTNESS --timeout-ms 300000 --output-dir pluginval-logs --validate "$env:ART/VST3/SSInger.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: clap-validator on the CLAP
        shell: pwsh
        run: |
          gh release download $env:CLAP_VALIDATOR_VERSION -R free-audio/clap-validator -p '*windows.zip' -O cv.zip
          Expand-Archive cv.zip -DestinationPath cv
          $cv = Get-ChildItem -Recurse -Filter clap-validator.exe cv | Select-Object -First 1
          & $cv.FullName validate "$env:ART/CLAP/SSInger.clap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack bundles
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$env:ART/VST3/SSInger.vst3", "$env:ART/CLAP/SSInger.clap", "$env:ART/Standalone/SSInger.exe" -DestinationPath dist/SSInger-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSInger-windows-x64
          path: |
            dist/
            pluginval-logs/
          if-no-files-found: warn

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -S SSInger -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3, AU, CLAP, Standalone and the C tests
        run: cmake --build build --parallel --target SSInger_VST3 SSInger_AU SSInger_CLAP SSInger_Standalone test_6850_midi

      - name: Offline C tests
        run: ctest --test-dir build --output-on-failure

      - name: Universal binaries
        run: |
          for b in "$ART/VST3/SSInger.vst3/Contents/MacOS/SSInger" "$ART/AU/SSInger.component/Contents/MacOS/SSInger" \
                   "$ART/CLAP/SSInger.clap/Contents/MacOS/SSInger" "$ART/Standalone/SSInger.app/Contents/MacOS/SSInger"; do
            lipo -info "$b"
            lipo "$b" -verify_arch arm64 x86_64
          done

      # Ad-hoc signature: enough for Apple silicon to load the code and for
      # auval/pluginval here. Not a Developer ID: users still clear the
      # quarantine flag on downloaded copies (BUILD.md).
      - name: Ad-hoc codesign
        run: |
          for b in "$ART/VST3/SSInger.vst3" "$ART/AU/SSInger.component" "$ART/CLAP/SSInger.clap" "$ART/Standalone/SSInger.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose=2 "$b"
          done

      - name: auval on the AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/SSInger.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i ssinger || true
          auval -strict -v aumu Ssng S263

      - name: Get pluginval
        run: |
          gh release download "$PLUGINVAL_VERSION" -R Tracktion/pluginval -p pluginval_macOS.zip -O pv.zip
          unzip -q pv.zip -d pv
          echo "PLUGINVAL=$PWD/pv/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"

      - name: pluginval on the VST3
        run: |
          "$PLUGINVAL" --strictness-level "$STRICTNESS" --timeout-ms 300000 \
            --output-dir pluginval-logs --validate "$ART/VST3/SSInger.vst3"

      - name: pluginval on the AU
        run: |
          "$PLUGINVAL" --strictness-level "$STRICTNESS" --timeout-ms 300000 \
            --output-dir pluginval-logs --validate ~/Library/Audio/Plug-Ins/Components/SSInger.component

      - name: clap-validator on the CLAP
        run: |
          gh release download "$CLAP_VALIDATOR_VERSION" -R free-audio/clap-validator -p '*macos-universal.zip' -O cv.zip
          unzip -q cv.zip -d cv
          CV="$(find cv -type f -name clap-validator | head -n 1)"
          chmod +x "$CV"
          xattr -dr com.apple.quarantine cv 2>/dev/null || true
          "$CV" validate "$ART/CLAP/SSInger.clap"

      - name: Pack bundles
        if: always()
        run: |
          mkdir -p dist
          cd "$ART"
          ditto -c -k --sequesterRsrc --keepParent VST3/SSInger.vst3 "$GITHUB_WORKSPACE/dist/SSInger-macos-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent AU/SSInger.component "$GITHUB_WORKSPACE/dist/SSInger-macos-AU.zip"
          ditto -c -k --sequesterRsrc --keepParent CLAP/SSInger.clap "$GITHUB_WORKSPACE/dist/SSInger-macos-CLAP.zip"
          ditto -c -k --sequesterRsrc --keepParent Standalone/SSInger.app "$GITHUB_WORKSPACE/dist/SSInger-macos-Standalone.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSInger-macos-universal
          path: |
            dist/
            pluginval-logs/
          if-no-files-found: warn
